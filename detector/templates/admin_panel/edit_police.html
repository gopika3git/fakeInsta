{% extends "admin_panel/_base.html" %}
{% block title %}Edit Officer{% endblock %}
{% block page_title %}Edit Officer Record{% endblock %}

{% block content %}
<div class="panel">
  <div class="panel-header">
    <h2>Editing: {{ officer.full_name }} ({{ officer.badge_no }})</h2>
  </div>
  <div class="panel-body">
    <form method="post">{% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" class="form-control" value="{{ officer.full_name }}" required>
        </div>
        <div class="form-group">
          <label>Badge Number</label>
          <input type="text" name="badge_no" class="form-control" value="{{ officer.badge_no }}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Station</label>
          <input type="text" name="station" class="form-control" value="{{ officer.station }}" required>
        </div>
        <div class="form-group">
          <label>Rank</label>
          <input type="text" name="rank" class="form-control" value="{{ officer.rank }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ officer.phone }}">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" value="{{ officer.email }}">
        </div>
      </div>
      <div class="form-group">
        <label style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" name="is_active" {% if officer.is_active %}checked{% endif %}>
          Account Active (officer can login)
        </label>
      </div>
      <hr class="divider">
      <div class="form-group">
        <label>Reset Password (leave blank to keep current)</label>
        <input type="password" name="password" class="form-control" placeholder="New password">
      </div>
      <div class="flex-row">
        <button type="submit" class="btn">💾 Save Changes</button>
        <a href="{% url 'admin_view_police' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
