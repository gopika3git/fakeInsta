{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Citizen Registration · Cyber Investigation Portal</title>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-box" style="max-width: 520px;">
    <div class="seal">📝</div>
    <h1>Citizen Registration</h1>
    <div class="auth-sub">CREATE NEW INVESTIGATIVE ACCOUNT</div>

    {% if messages %}
      {% for m in messages %}<div class="alert {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% endif %}

    <form method="post">{% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>Full Name <span class="req">*</span></label>
          <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Username <span class="req">*</span></label>
          <input type="text" name="username" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email <span class="req">*</span></label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Phone <span class="req">*</span></label>
          <input type="text" name="phone" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password <span class="req">*</span></label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Confirm Password <span class="req">*</span></label>
          <input type="password" name="confirm" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn" style="width: 100%;">Create Account →</button>
    </form>
    <div class="auth-foot">
      Already registered? <a href="{% url 'user_login' %}">Login here</a> ·
      <a href="{% url 'index' %}">← Home</a>
    </div>
  </div>
</div>
</body>
</html>
